name: ANEDemo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
# Listing the xcconfig here (in a subfolder) gives it a stable reference; configFiles alone gets a random
# ID on every generation. Local.xcconfig is left out on purpose: it is git-ignored and optional.
fileGroups:
  - Config/Signing.xcconfig
packages:
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.33.0
targets:
  ANEDemo:
    type: application
    platform: macOS
    sources:
      - path: ANEDemo
        excludes: ["D1/LICENSE"]
      - path: Models/EmotionNet.mlpackage
        type: file
        buildPhase: sources
      - path: Models/GestureNet.mlpackage
        type: file
        buildPhase: sources
      - path: Models/BlazeFace.mlpackage
        type: file
        buildPhase: sources
      - path: Models/d1_plan.json
        type: file
        buildPhase: resources
        optional: true
    dependencies:
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - package: MLXSwift
        product: MLXFast
    info:
      path: ANEDemo/Info.plist
      properties:
        # Don't let macOS turn thumbs-up / peace / heart into Reactions effects drawn into our frames.
        # (A choice the user makes in the menu-bar Video menu still overrides this default.)
        NSCameraReactionEffectGesturesEnabledDefault: false
    entitlements:
      path: ANEDemo/ANEDemo.entitlements
      properties:
        # Not sandboxed: the d1 weights (2.2 GB) are read from a folder outside the app
        # (weights/ in the repo, Application Support, or one chosen in Pipeline › Locate d1 Weights…).
        com.apple.security.app-sandbox: false
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_NAME: ANE Classifiers
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ANEDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Live webcam frames are classified on-device (face expression and hand gesture). Nothing leaves this Mac.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        COREML_CODEGEN_LANGUAGE: None
    # Signing lives in Config/Signing.xcconfig (ad-hoc by default; optional git-ignored Config/Local.xcconfig
    # for your own identity).
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig

  # Numeric check of the Swift d1 port against the mlx-vlm reference (no camera, no UI).
  d1check:
    type: tool
    platform: macOS
    sources:
      - path: ANEDemo/D1
        excludes: ["LICENSE"]
      - path: Tools/d1check
    dependencies:
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - package: MLXSwift
        product: MLXFast
    settings:
      base:
        PRODUCT_NAME: d1check
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
